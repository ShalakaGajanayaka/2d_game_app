<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="SkyRush 2D Crash Game - Real-time High Multiplier Gaming">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SkyRush">
  <meta name="theme-color" content="#080c14">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png?v=2">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=2">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png?v=2">
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SkyRush 2D</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #080c14;
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Ultra-Lightweight Pure CSS Preloader */
    #skyrush-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: radial-gradient(circle at center, #0e1726 0%, #080c14 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999999;
      transition: opacity 0.45s ease-out, visibility 0.45s;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #skyrush-preloader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .preloader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .plane-pulse-wrapper {
      position: relative;
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .pulse-ring {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
      animation: pulseAnimation 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulseAnimation {
      0%, 100% {
        transform: scale(0.92);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.85;
        box-shadow: 0 0 28px rgba(56, 189, 248, 0.45);
      }
    }
    .plane-icon {
      filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.4));
      animation: planeFloat 2.4s ease-in-out infinite alternate;
    }
    @keyframes planeFloat {
      0% {
        transform: translateY(3px) rotate(45deg);
      }
      100% {
        transform: translateY(-6px) rotate(45deg);
      }
    }
    .brand-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
    .brand-sky {
      color: #38bdf8;
    }
    .brand-rush {
      color: #f59e0b;
    }
    .progress-track {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background: linear-gradient(90deg, #38bdf8, #f59e0b);
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      animation: progressSweep 1.6s ease-in-out infinite;
    }
    @keyframes progressSweep {
      0% {
        left: -45%;
      }
      100% {
        left: 100%;
      }
    }
    .loading-label {
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      animation: labelPulse 1.8s ease-in-out infinite alternate;
    }
    @keyframes labelPulse {
      0% {
        opacity: 0.35;
      }
      100% {
        opacity: 0.85;
      }
    }
  </style>
</head>
<body>
  <!-- Ultra-Lightweight Pure CSS/SVG Preloader -->
  <div id="skyrush-preloader">
    <div class="preloader-container">
      <div class="plane-pulse-wrapper">
        <div class="pulse-ring"></div>
        <svg class="plane-icon" viewBox="0 0 24 24" width="46" height="46" fill="none">
          <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="url(#planeGradient)"/>
          <defs>
            <linearGradient id="planeGradient" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#38BDF8"/>
              <stop offset="1" stop-color="#F59E0B"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="brand-title">
        <span class="brand-sky">Sky</span><span class="brand-rush">Rush</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div class="loading-label">LOADING SKYRUSH...</div>
    </div>
  </div>

  <script>
    // Smooth Preloader Dismissal Handshake
    window.hideSkyrushPreloader = function() {
      var p = document.getElementById('skyrush-preloader');
      if (p && !p.classList.contains('fade-out')) {
        p.classList.add('fade-out');
        setTimeout(function() {
          if (p.parentNode) p.parentNode.removeChild(p);
        }, 500);
      }
    };

    // Trigger on Flutter's first rendered frame
    window.addEventListener('flutter-first-frame', window.hideSkyrushPreloader);

    // Mutation observer detecting Flutter mounting onto the DOM
    var flutterObserver = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        setTimeout(window.hideSkyrushPreloader, 150);
        obs.disconnect();
      }
    });
    flutterObserver.observe(document.body, { childList: true, subtree: true });

    // Safety fallback (ensures preloader never stays stuck on slow networks)
    setTimeout(window.hideSkyrushPreloader, 7000);

    // Lightweight PWA & Fullscreen Helpers for Mobile
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
    });

    window.isPwaInstallAvailable = function() {
      return window.deferredPwaPrompt !== null;
    };

    window.triggerPwaPrompt = function() {
      if (window.deferredPwaPrompt) {
        window.deferredPwaPrompt.prompt();
        window.deferredPwaPrompt.userChoice.then(function(choice) {
          if (choice && choice.outcome === 'accepted') {
            console.log('SkyRush PWA installed successfully');
          }
          window.deferredPwaPrompt = null;
        });
        return true;
      }
      return false;
    };

    window.isPwaStandalone = function() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true ||
             document.referrer.includes('android-app://');
    };

    window.isIosDevice = function() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    };

    window.isAndroidDevice = function() {
      return /Android/i.test(navigator.userAgent);
    };

    window.isGameFullscreen = function() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    };

    window.toggleGameFullscreen = function() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        var el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(function() {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(function() {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
