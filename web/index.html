  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="SkyRush 2D Crash Game - Real-time High Multiplier Gaming">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <style>
    body {
      background-color: #080c14;
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Ultra-Lightweight Pure CSS Preloader */
    #skyrush-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: radial-gradient(circle at center, #0e1726 0%, #080c14 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999999;
      transition: opacity 0.45s ease-out, visibility 0.45s;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #skyrush-preloader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .preloader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .plane-pulse-wrapper {
      position: relative;
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .pulse-ring {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
      animation: pulseAnimation 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulseAnimation {
      0%, 100% {
        transform: scale(0.92);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.85;
        box-shadow: 0 0 28px rgba(56, 189, 248, 0.45);
      }
    }
    .plane-icon {
      filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.4));
      animation: planeFloat 2.4s ease-in-out infinite alternate;
    }
    @keyframes planeFloat {
      0% {
        transform: translateY(3px) rotate(45deg);
      }
      100% {
        transform: translateY(-6px) rotate(45deg);
      }
    }
    .brand-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
    .brand-sky {
      color: #38bdf8;
    }
    .brand-rush {
      color: #f59e0b;
    }
    .progress-track {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background: linear-gradient(90deg, #38bdf8, #f59e0b);
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      animation: progressSweep 1.6s ease-in-out infinite;
    }
    @keyframes progressSweep {
      0% {
        left: -45%;
      }
      100% {
        left: 100%;
      }
    }
    .loading-label {
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      animation: labelPulse 1.8s ease-in-out infinite alternate;
    }
    @keyframes labelPulse {
      0% {
        opacity: 0.35;
      }
      100% {
        opacity: 0.85;
      }
    }
  </style>
</head>
<body>
  <!-- Ultra-Lightweight Pure CSS/SVG Preloader -->
  <div id="skyrush-preloader">
    <div class="preloader-container">
      <div class="plane-pulse-wrapper">
        <div class="pulse-ring"></div>
        <svg class="plane-icon" viewBox="0 0 24 24" width="46" height="46" fill="none">
          <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="url(#planeGradient)"/>
          <defs>
            <linearGradient id="planeGradient" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#38BDF8"/>
              <stop offset="1" stop-color="#F59E0B"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="brand-title">
        <span class="brand-sky">Sky</span><span class="brand-rush">Rush</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div class="loading-label">LOADING SKYRUSH...</div>
    </div>
  </div>

  <script>
    // Smooth Preloader Dismissal Handshake
    window.hideSkyrushPreloader = function() {
      var p = document.getElementById('skyrush-preloader');
      if (p && !p.classList.contains('fade-out')) {
        p.classList.add('fade-out');
        setTimeout(function() {
          if (p.parentNode) p.parentNode.removeChild(p);
        }, 500);
      }
    };

    // Trigger on Flutter's first rendered frame
    window.addEventListener('flutter-first-frame', window.hideSkyrushPreloader);

    // Mutation observer detecting Flutter mounting onto the DOM
    var flutterObserver = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        setTimeout(window.hideSkyrushPreloader, 150);
        obs.disconnect();
      }
    });
    flutterObserver.observe(document.body, { childList: true, subtree: true });

    // Safety fallback (ensures preloader never stays stuck on slow networks)
    setTimeout(window.hideSkyrushPreloader, 7000);

    // Lightweight PWA & Fullscreen Helpers for Mobile
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
    });

    window.isPwaInstallAvailable = function() {
      return window.deferredPwaPrompt !== null;
    };

    window.triggerPwaPrompt = function() {
      if (window.deferredPwaPrompt) {
        window.deferredPwaPrompt.prompt();
        window.deferredPwaPrompt.userChoice.then(function(choice) {
          if (choice && choice.outcome === 'accepted') {
            console.log('SkyRush PWA installed successfully');
          }
          window.deferredPwaPrompt = null;
        });
        return true;
      }
      return false;
    };

    window.isPwaStandalone = function() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true ||
             document.referrer.includes('android-app://');
    };

    window.isIosDevice = function() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    };

    window.isAndroidDevice = function() {
      return /Android/i.test(navigator.userAgent);
    };

    window.isGameFullscreen = function() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    };

    window.toggleGameFullscreen = function() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        var el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(function() {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(function() {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    };

    // SkyRush Dynamic Web Audio Synthesizer (0 KB download, tension riser engine & ambient music)
    window.SkyRushAudio = (function() {
      var audioCtx = null;
      var isMuted = false;
      var isFlightActive = false;
      var osc1 = null;
      var osc2 = null;
      var lfo = null;
      var lfoGain = null;
      var filter = null;
      var flightGain = null;

      // Motivational Ambient Lounge Music State
      var musicGain = null;
      var isMusicPlaying = false;
      var musicInterval = null;
      var chordIndex = 0;

      function getContext() {
        if (!audioCtx) {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function startMusic() {
        return; // Background music completely removed
        if (isMusicPlaying) return;
        var ctx = getContext();
        if (!ctx) return;

        if (ctx.state === 'suspended') {
          ctx.resume().then(function() {
            if (!isMusicPlaying && !isMuted) {
              startMusic();
            }
          });
          return;
        }

        isMusicPlaying = true;

        if (!musicGain) {
          musicGain = ctx.createGain();
          musicGain.gain.setValueAtTime(isMuted ? 0 : 0.095, ctx.currentTime);
          musicGain.connect(ctx.destination);
        }

        // Upbeat Aviator-Style Arcade House Groove (F Major / D Minor - 124 BPM)
        // High-energy, joyful, triumphant progression: F -> C -> Dm -> Bb
        var chordData = [
          { bass: 87.31, pad: [174.61, 220.00, 261.63, 329.63], arps: [349.23, 440.00, 523.25, 659.25] }, // F2 & FMaj7
          { bass: 65.41, pad: [196.00, 261.63, 329.63, 392.00], arps: [392.00, 523.25, 659.25, 783.99] }, // C2 & C(add9)
          { bass: 73.42, pad: [174.61, 220.00, 293.66, 349.23], arps: [293.66, 349.23, 440.00, 587.33] }, // D2 & Dm7
          { bass: 58.27, pad: [174.61, 233.08, 293.66, 349.23], arps: [233.08, 293.66, 349.23, 466.16] }, // Bb1 & BbMaj
        ];

        // 124 BPM Dance/Casino Tempo: 4 beats per bar, 0.484s per beat (1.936s per bar)
        var BEAT_DUR = 0.484;
        var BAR_DUR = BEAT_DUR * 4;

        function playBar() {
          if (!isMusicPlaying || !audioCtx) return;
          try {
            var now = audioCtx.currentTime;
            var current = chordData[chordIndex % chordData.length];
            chordIndex++;

            var activeNodes = [];

            // 1. Bright Upbeat Synth Chords (F-Major Pop Arcade Vibe)
            var chordFilter = audioCtx.createBiquadFilter();
            chordFilter.type = 'lowpass';
            chordFilter.frequency.setValueAtTime(650, now);
            chordFilter.frequency.linearRampToValueAtTime(850, now + 0.9);
            chordFilter.frequency.linearRampToValueAtTime(550, now + BAR_DUR);

            var chordGain = audioCtx.createGain();
            chordGain.gain.setValueAtTime(0.0001, now);
            chordGain.gain.linearRampToValueAtTime(0.13, now + 0.15);
            chordGain.gain.linearRampToValueAtTime(0.10, now + (BAR_DUR * 0.8));
            chordGain.gain.linearRampToValueAtTime(0.0001, now + BAR_DUR + 0.05);

            chordFilter.connect(chordGain);
            chordGain.connect(musicGain);

            for (var i = 0; i < current.pad.length; i++) {
              var osc = audioCtx.createOscillator();
              osc.type = i % 2 === 0 ? 'sine' : 'triangle';
              osc.frequency.setValueAtTime(current.pad[i], now);
              osc.detune.setValueAtTime((i % 2 === 0 ? 3.0 : -3.0), now);
              osc.connect(chordFilter);
              osc.start(now);
              osc.stop(now + BAR_DUR + 0.1);
              activeNodes.push(osc);
            }

            // 2. Energetic 124 BPM 4-on-the-Floor Beat & Bouncy Funky Bassline
            for (var b = 0; b < 4; b++) {
              (function(beatIdx) {
                var bTime = now + (beatIdx * BEAT_DUR);

                // --- A. Club Kick Drum (Punchy 160Hz -> 48Hz pitch-dive thump on EVERY beat) ---
                var kickOsc = audioCtx.createOscillator();
                var kickGain = audioCtx.createGain();
                kickOsc.type = 'sine';
                kickOsc.frequency.setValueAtTime(160, bTime);
                kickOsc.frequency.exponentialRampToValueAtTime(48, bTime + 0.065); // Fast punchy drop

                kickGain.gain.setValueAtTime(0.26, bTime);
                kickGain.gain.exponentialRampToValueAtTime(0.0001, bTime + 0.20);

                kickOsc.connect(kickGain);
                kickGain.connect(musicGain);
                kickOsc.start(bTime);
                kickOsc.stop(bTime + 0.22);
                activeNodes.push(kickOsc);
                activeNodes.push(kickGain);

                // --- B. Bouncy Funky Bass (16th-note syncopated groove on beat + offbeat) ---
                var bassTimes = [bTime, bTime + (BEAT_DUR * 0.5)];
                var bassFreqs = [current.bass, current.bass * 1.5]; // root and energetic 5th bounce
                for (var bi = 0; bi < 2; bi++) {
                  var subTime = bassTimes[bi];
                  var subOsc = audioCtx.createOscillator();
                  var subGain = audioCtx.createGain();
                  var subFilter = audioCtx.createBiquadFilter();

                  subOsc.type = 'triangle';
                  subOsc.frequency.setValueAtTime(bassFreqs[bi], subTime);

                  subFilter.type = 'lowpass';
                  subFilter.frequency.setValueAtTime(320, subTime);
                  subFilter.frequency.exponentialRampToValueAtTime(90, subTime + 0.18);

                  subGain.gain.setValueAtTime(0.0001, subTime);
                  subGain.gain.linearRampToValueAtTime(0.20, subTime + 0.02);
                  subGain.gain.exponentialRampToValueAtTime(0.0001, subTime + 0.22);

                  subOsc.connect(subFilter);
                  subFilter.connect(subGain);
                  subGain.connect(musicGain);

                  subOsc.start(subTime);
                  subOsc.stop(subTime + 0.24);
                  activeNodes.push(subOsc);
                  activeNodes.push(subFilter);
                  activeNodes.push(subGain);
                }

                // --- C. Snappy Handclap / Snare on Beats 2 and 4 (beatIdx 1 and 3) ---
                if (beatIdx === 1 || beatIdx === 3) {
                  var snareLen = Math.floor(audioCtx.sampleRate * 0.10);
                  var snareBuffer = audioCtx.createBuffer(1, snareLen, audioCtx.sampleRate);
                  var snareData = snareBuffer.getChannelData(0);
                  for (var sn = 0; sn < snareLen; sn++) {
                    snareData[sn] = (Math.random() * 2 - 1) * Math.exp(-sn / (snareLen * 0.25));
                  }
                  var snareSource = audioCtx.createBufferSource();
                  snareSource.buffer = snareBuffer;

                  var snareFilter = audioCtx.createBiquadFilter();
                  snareFilter.type = 'bandpass';
                  snareFilter.frequency.setValueAtTime(1500, bTime);
                  snareFilter.Q.setValueAtTime(1.6, bTime);

                  var snareGain = audioCtx.createGain();
                  snareGain.gain.setValueAtTime(0.11, bTime);
                  snareGain.gain.exponentialRampToValueAtTime(0.0001, bTime + 0.10);

                  snareSource.connect(snareFilter);
                  snareFilter.connect(snareGain);
                  snareGain.connect(musicGain);

                  snareSource.start(bTime);
                  snareSource.stop(bTime + 0.11);
                  activeNodes.push(snareSource);
                  activeNodes.push(snareFilter);
                  activeNodes.push(snareGain);
                }

                // --- D. Crisp Sizzling Hi-Hat (on the "and" of every beat) ---
                var hatTime = bTime + (BEAT_DUR * 0.5);
                var hatLen = Math.floor(audioCtx.sampleRate * 0.035);
                var hatBuffer = audioCtx.createBuffer(1, hatLen, audioCtx.sampleRate);
                var hatData = hatBuffer.getChannelData(0);
                for (var h = 0; h < hatLen; h++) {
                  hatData[h] = (Math.random() * 2 - 1) * Math.exp(-h / (hatLen * 0.2));
                }
                var hatSource = audioCtx.createBufferSource();
                hatSource.buffer = hatBuffer;

                var hatFilter = audioCtx.createBiquadFilter();
                hatFilter.type = 'highpass';
                hatFilter.frequency.setValueAtTime(8000, hatTime);

                var hatGain = audioCtx.createGain();
                hatGain.gain.setValueAtTime(0.06, hatTime);
                hatGain.gain.exponentialRampToValueAtTime(0.0001, hatTime + 0.032);

                hatSource.connect(hatFilter);
                hatFilter.connect(hatGain);
                hatGain.connect(musicGain);

                hatSource.start(hatTime);
                hatSource.stop(hatTime + 0.035);
                activeNodes.push(hatSource);
                activeNodes.push(hatFilter);
                activeNodes.push(hatGain);

                // --- E. Sparkling Arcade Casino Pluck (Cheerful arpeggio notes) ---
                var arpTime = bTime + (BEAT_DUR * 0.25);
                var arpOsc = audioCtx.createOscillator();
                var arpGain = audioCtx.createGain();
                arpOsc.type = 'sine';
                arpOsc.frequency.setValueAtTime(current.arps[beatIdx % current.arps.length], arpTime);

                arpGain.gain.setValueAtTime(0.0001, arpTime);
                arpGain.gain.linearRampToValueAtTime(0.06, arpTime + 0.015);
                arpGain.gain.exponentialRampToValueAtTime(0.0001, arpTime + 0.16);

                arpOsc.connect(arpGain);
                arpGain.connect(musicGain);

                arpOsc.start(arpTime);
                arpOsc.stop(arpTime + 0.18);
                activeNodes.push(arpOsc);
                activeNodes.push(arpGain);
              })(b);
            }

            setTimeout(function() {
              try {
                for (var j = 0; j < activeNodes.length; j++) {
                  if (activeNodes[j].disconnect) activeNodes[j].disconnect();
                }
                chordFilter.disconnect();
                chordGain.disconnect();
              } catch (e) {}
            }, Math.floor(BAR_DUR * 1000) + 300);
          } catch (e) {}
        }

        playBar();
        musicInterval = setInterval(playBar, Math.floor(BAR_DUR * 1000));
      }

      function stopMusic() {
        isMusicPlaying = false;
        if (musicInterval) {
          clearInterval(musicInterval);
          musicInterval = null;
        }
      }

      function ensureAutoplayResume() {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      window.addEventListener('click', ensureAutoplayResume, { once: false, passive: true });
      window.addEventListener('touchstart', ensureAutoplayResume, { once: false, passive: true });
      window.addEventListener('keydown', ensureAutoplayResume, { once: false, passive: true });

      return {
        init: function() {
          try {
            var saved = localStorage.getItem('skyrush_sound_muted');
            if (saved === 'true') {
              isMuted = true;
            }
          } catch(e) {}
        },

        setMuted: function(muted) {
          isMuted = !!muted;
          try {
            localStorage.setItem('skyrush_sound_muted', isMuted ? 'true' : 'false');
          } catch(e) {}
          if (isMuted && flightGain && audioCtx) {
            flightGain.gain.setValueAtTime(0, audioCtx.currentTime);
          } else if (!isMuted && flightGain && audioCtx && isFlightActive) {
            flightGain.gain.setTargetAtTime(0.038, audioCtx.currentTime, 0.1);
          }
          if (musicGain && audioCtx) {
            musicGain.gain.setValueAtTime(0, audioCtx.currentTime);
          }
          // UPGRADE_TODO: Background music temporarily commented out for studio upgrade
          // if (!isMuted && !isMusicPlaying) {
          //   startMusic();
          // }
        },

        isMuted: function() {
          return isMuted;
        },

        startMusic: function() {
          // UPGRADE_TODO: Temporarily disabled for upcoming studio soundtrack upgrade
          // startMusic();
        },

        stopMusic: function() {
          stopMusic();
        },

        startFlight: function() {
          if (isFlightActive) return;
          var ctx = getContext();
          if (!ctx) return;
          isFlightActive = true;

          try {
            var now = ctx.currentTime;

            // Main Jet Turbine Oscillator (Triangle - deep, warm, velvety fundamental)
            osc1 = ctx.createOscillator();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(110, now);

            // Second Harmonic / Air Shimmer (Sine - gentle, consonant harmonic layer)
            osc2 = ctx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(146.6, now); // Warm perfect fourth consonant ratio (1.333x)

            // Gentle LFO for peaceful breathing pulse (never rapid or frantic)
            lfo = ctx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(1.8, now); // Calm 1.8 Hz meditative rhythm
            lfoGain = ctx.createGain();
            lfoGain.gain.setValueAtTime(4.0, now); // Soft +/- 4Hz vibrato depth
            lfo.connect(lfoGain);
            lfoGain.connect(osc1.frequency);

            // Low-pass Filter to keep sound pleasant, smooth, warm, and calm (no piercing highs)
            filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(220, now);
            filter.Q.setValueAtTime(1.0, now); // Gentle slope, zero acoustic ringing

            // Flight Volume Gain (gentle ambient layer that coexists harmoniously with music)
            flightGain = ctx.createGain();
            var targetVol = isMuted ? 0 : 0.038;
            flightGain.gain.setValueAtTime(0.0001, now);
            flightGain.gain.exponentialRampToValueAtTime(Math.max(0.0001, targetVol), now + 0.35);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(flightGain);
            flightGain.connect(ctx.destination);

            osc1.start(now);
            osc2.start(now);
            lfo.start(now);
          } catch (e) {
            console.warn('[SkyRushAudio] Error starting flight audio:', e);
          }
        },

        updateFlight: function(mult) {
          if (!isFlightActive || !audioCtx || !osc1 || !osc2 || !filter) return;
          try {
            var m = Math.max(1.0, parseFloat(mult) || 1.0);
            var now = audioCtx.currentTime;

            // Pitch ascends smoothly with soft asymptotic curve:
            // Prevents high multiplier (>80x) from becoming sharp, whistling, or violently shaking
            var logMult = Math.log2(m);
            var curve = logMult / (logMult + 4.0); // Hill saturation curve [0.0 -> 1.0]

            var targetFreq = 110 + (curve * 130);   // Max 240Hz (warm cello register, never piercing)
            var targetFilter = 220 + (curve * 120); // Max 340Hz (warm low-mid band, no harsh whistle)
            var targetLfo = 1.8 + (curve * 0.9);    // Max 2.7Hz (peaceful breathing, no rapid wobble)

            // As multiplier climbs, damp the wobble depth for a silky smooth, glassy glide
            var targetLfoGain = Math.max(1.5, 4.0 - (curve * 2.2));

            osc1.frequency.setTargetAtTime(targetFreq, now, 0.1);
            osc2.frequency.setTargetAtTime(targetFreq * 1.333, now, 0.1);
            filter.frequency.setTargetAtTime(targetFilter, now, 0.1);
            if (lfo) {
              lfo.frequency.setTargetAtTime(targetLfo, now, 0.1);
            }
            if (lfoGain) {
              lfoGain.gain.setTargetAtTime(targetLfoGain, now, 0.1);
            }

            // Balanced audio mix: keep motivational background music steady and audible throughout flight
            if (musicGain && !isMuted) {
              musicGain.gain.setTargetAtTime(0.095, now, 0.2);
            }
          } catch (e) {}
        },

        stopFlight: function(crashed) {
          if (!isFlightActive) return;
          isFlightActive = false;
          if (!audioCtx) return;

          try {
            var now = audioCtx.currentTime;
            var curOsc1 = osc1;
            var curOsc2 = osc2;
            var curLfo = lfo;
            var curLfoGain = lfoGain;
            var curGain = flightGain;
            var curFilter = filter;

            osc1 = null;
            osc2 = null;
            lfo = null;
            lfoGain = null;
            flightGain = null;
            filter = null;

            if (curGain) {
              if (crashed && !isMuted) {
                // Gentle pitch dive and smooth swoosh fade on crash
                if (curFilter) {
                  curFilter.frequency.exponentialRampToValueAtTime(100, now + 0.22);
                }
                curGain.gain.setValueAtTime(curGain.gain.value, now);
                curGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
              } else {
                curGain.gain.setValueAtTime(curGain.gain.value, now);
                curGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
              }
            }

            // Keep ambient music volume smoothly at balanced target
            if (musicGain && !isMuted) {
              musicGain.gain.setTargetAtTime(0.095, audioCtx.currentTime, 0.35);
            }

            setTimeout(function() {
              try {
                if (curOsc1) curOsc1.stop();
                if (curOsc2) curOsc2.stop();
                if (curLfo) curLfo.stop();
                if (curOsc1) curOsc1.disconnect();
                if (curOsc2) curOsc2.disconnect();
                if (curLfoGain) curLfoGain.disconnect();
                if (curFilter) curFilter.disconnect();
                if (curGain) curGain.disconnect();
              } catch (e) {}
            }, 300);
          } catch (e) {}
        },

        playCashout: function() {
          if (isMuted) return;
          var ctx = getContext();
          if (!ctx) return;

          try {
            var now = ctx.currentTime;
            var note1 = ctx.createOscillator();
            var note2 = ctx.createOscillator();
            var gain = ctx.createGain();

            note1.type = 'sine';
            note2.type = 'triangle';

            // Sparkling ascending chime
            note1.frequency.setValueAtTime(587.33, now); // D5
            note1.frequency.exponentialRampToValueAtTime(1174.66, now + 0.18); // D6

            note2.frequency.setValueAtTime(880, now); // A5
            note2.frequency.exponentialRampToValueAtTime(1760, now + 0.22); // A6

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.09, now + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

            note1.connect(gain);
            note2.connect(gain);
            gain.connect(ctx.destination);

            note1.start(now);
            note2.start(now);
            note1.stop(now + 0.3);
            note2.stop(now + 0.3);
          } catch (e) {}
        },

        playCrash: function() {
          if (isMuted) return;
          var ctx = getContext();
          if (!ctx) return;

          try {
            var now = ctx.currentTime;

            // 1. Sub-Bass Punch (Transients): 160Hz -> 36Hz in 0.30s
            var bassOsc = ctx.createOscillator();
            var bassGain = ctx.createGain();

            bassOsc.type = 'triangle';
            bassOsc.frequency.setValueAtTime(160, now);
            bassOsc.frequency.exponentialRampToValueAtTime(36, now + 0.30);

            bassGain.gain.setValueAtTime(0.0001, now);
            bassGain.gain.exponentialRampToValueAtTime(0.24, now + 0.02);
            bassGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);

            bassOsc.connect(bassGain);
            bassGain.connect(ctx.destination);

            bassOsc.start(now);
            bassOsc.stop(now + 0.36);

            // 2. Air blast / supersonic dissipation whoosh (punchier yet pleasant)
            var bufferSize = Math.floor(ctx.sampleRate * 0.35);
            var noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            var output = noiseBuffer.getChannelData(0);
            for (var i = 0; i < bufferSize; i++) {
              output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
            }

            var whiteNoise = ctx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;

            var filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(650, now);
            filter.frequency.exponentialRampToValueAtTime(75, now + 0.30);

            var noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.0001, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.16, now + 0.025);
            noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);

            whiteNoise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(ctx.destination);

            whiteNoise.start(now);
            whiteNoise.stop(now + 0.36);

            setTimeout(function() {
              try {
                bassOsc.disconnect();
                bassGain.disconnect();
                whiteNoise.disconnect();
                filter.disconnect();
                noiseGain.disconnect();
              } catch (e) {}
            }, 400);
          } catch (e) {
            console.warn('[SkyRushAudio] Error playing crash audio:', e);
          }
        }
      };
    })();

    window.SkyRushAudio.init();
  </script>
